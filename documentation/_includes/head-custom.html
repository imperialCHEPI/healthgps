<style>
  /* Mermaid diagrams (if any remain as code blocks) */
  .mermaid-scroll {
    overflow-x: auto;
    max-width: 100%;
    margin: 1em 0;
    -webkit-overflow-scrolling: touch;
  }

  .mermaid-scroll .mermaid svg {
    display: block;
    max-width: none !important;
    height: auto;
  }

  /* Sequence / figure SVGs: fit the content column cleanly (no sideways scroll) */
  section img[src*="policy_sequence"],
  section img[src*="baseline_intervention_pair_sequence"],
  section img[src*="wholepicture_HGPS"],
  section img[src*="schemas_overview"],
  section img[src*="initialise_sequence"] {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
    margin: 0.75em auto;
  }
</style>

<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  mermaid.initialize({
    startOnLoad: false,
    theme: 'neutral',
    themeVariables: {
      fontSize: '17px',
    },
    sequence: {
      useMaxWidth: true,
      diagramMarginX: 40,
      diagramMarginY: 12,
      actorMargin: 60,
      width: 170,
      height: 65,
      boxMargin: 10,
      boxTextMargin: 6,
      noteMargin: 12,
      messageMargin: 45,
      mirrorActors: true,
    },
    flowchart: {
      useMaxWidth: true,
    },
  });

  document.addEventListener('DOMContentLoaded', async () => {
    const blocks = document.querySelectorAll('pre > code.language-mermaid');
    for (const code of blocks) {
      const pre = code.parentElement;
      const wrapper = document.createElement('div');
      wrapper.className = 'mermaid-scroll';
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      wrapper.appendChild(div);
      pre.replaceWith(wrapper);
    }
    if (document.querySelector('.mermaid')) {
      await mermaid.run({ querySelector: '.mermaid' });
    }
  });
</script>
