<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="680" viewBox="0 0 780 680" role="img" aria-labelledby="title desc">
  <title id="title">Risk-factor model slots in the simulation pipeline</title>
  <desc id="desc">At initialisation both config slots run generate (static then dynamic). Each year both run update (static then dynamic).</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4672c4"/>
    </marker>
  </defs>

  <rect x="24" y="16" width="732" height="200" rx="8" fill="#f7f9fc" stroke="#9aa7b8"/>
  <text x="40" y="42" fill="#203864" font-family="Calibri, Arial, sans-serif" font-size="15" font-weight="bold">Initialisation (once per run)</text>

  <rect x="48" y="64" width="118" height="44" rx="4" fill="#dae2f3" stroke="#41719c"/>
  <text x="107" y="91" text-anchor="middle" fill="#203864" font-family="Calibri, Arial, sans-serif" font-size="13">Demographics</text>
  <path d="M166 86 H186" stroke="#4672c4" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="186" y="64" width="70" height="44" rx="4" fill="#dae2f3" stroke="#41719c"/>
  <text x="221" y="91" text-anchor="middle" fill="#203864" font-family="Calibri, Arial, sans-serif" font-size="13">SES</text>
  <path d="M256 86 H276" stroke="#4672c4" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="276" y="56" width="268" height="112" rx="6" fill="#fff2cc" stroke="#bf8f00" stroke-width="1.5"/>
  <text x="410" y="78" text-anchor="middle" fill="#203864" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="bold">Risk factors</text>
  <text x="410" y="100" text-anchor="middle" fill="#203864" font-family="Calibri, Arial, sans-serif" font-size="12">1) static slot: generate</text>
  <text x="410" y="120" text-anchor="middle" fill="#203864" font-family="Calibri, Arial, sans-serif" font-size="12">2) dynamic slot: generate</text>
  <text x="410" y="146" text-anchor="middle" fill="#666666" font-family="Calibri, Arial, sans-serif" font-size="11">both packs, in that order</text>
  <path d="M544 86 H564" stroke="#4672c4" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="564" y="64" width="80" height="44" rx="4" fill="#dae2f3" stroke="#41719c"/>
  <text x="604" y="91" text-anchor="middle" fill="#203864" font-family="Calibri, Arial, sans-serif" font-size="13">Diseases</text>
  <path d="M644 86 H664" stroke="#4672c4" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="664" y="64" width="72" height="44" rx="4" fill="#dae2f3" stroke="#41719c"/>
  <text x="700" y="91" text-anchor="middle" fill="#203864" font-family="Calibri, Arial, sans-serif" font-size="13">Analysis</text>

  <path d="M390 216 V248" stroke="#4672c4" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="200" y="248" width="380" height="412" rx="8" fill="#f7f9fc" stroke="#9aa7b8"/>
  <text x="390" y="276" text-anchor="middle" fill="#203864" font-family="Calibri, Arial, sans-serif" font-size="15" font-weight="bold">Each simulated year</text>

  <rect x="260" y="292" width="240" height="34" rx="4" fill="#dae2f3" stroke="#41719c"/>
  <text x="390" y="314" text-anchor="middle" fill="#203864" font-family="Calibri, Arial, sans-serif" font-size="13">Demographics update</text>
  <path d="M390 326 V344" stroke="#4672c4" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="260" y="344" width="240" height="34" rx="4" fill="#dae2f3" stroke="#41719c"/>
  <text x="390" y="366" text-anchor="middle" fill="#203864" font-family="Calibri, Arial, sans-serif" font-size="13">Net immigration</text>
  <path d="M390 378 V396" stroke="#4672c4" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="260" y="396" width="240" height="34" rx="4" fill="#dae2f3" stroke="#41719c"/>
  <text x="390" y="418" text-anchor="middle" fill="#203864" font-family="Calibri, Arial, sans-serif" font-size="13">SES (mainly newborns)</text>
  <path d="M390 430 V448" stroke="#4672c4" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="240" y="448" width="280" height="84" rx="6" fill="#fff2cc" stroke="#bf8f00" stroke-width="1.5"/>
  <text x="390" y="472" text-anchor="middle" fill="#203864" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="bold">Risk factors</text>
  <text x="390" y="494" text-anchor="middle" fill="#203864" font-family="Calibri, Arial, sans-serif" font-size="12">1) static slot: update</text>
  <text x="390" y="514" text-anchor="middle" fill="#203864" font-family="Calibri, Arial, sans-serif" font-size="12">2) dynamic slot: update</text>
  <path d="M390 532 V550" stroke="#4672c4" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="260" y="550" width="240" height="34" rx="4" fill="#dae2f3" stroke="#41719c"/>
  <text x="390" y="572" text-anchor="middle" fill="#203864" font-family="Calibri, Arial, sans-serif" font-size="13">Diseases update</text>
  <path d="M390 584 V602" stroke="#4672c4" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="260" y="602" width="240" height="34" rx="4" fill="#dae2f3" stroke="#41719c"/>
  <text x="390" y="624" text-anchor="middle" fill="#203864" font-family="Calibri, Arial, sans-serif" font-size="13">Analysis publish</text>
</svg>
