<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="title desc">
  <title id="title">How Health-GPS models a person</title>
  <desc id="desc">Detailed diagram of Person attributes and the mathematical assignment rules used at initialisation and each simulated year.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#203864"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#203864" flood-opacity="0.12"/>
    </filter>
    <style type="text/css"><![CDATA[
      .title { font-family: Calibri, 'Segoe UI', sans-serif; font-size: 22px; font-weight: 700; fill: #002060; }
      .subtitle { font-family: Calibri, 'Segoe UI', sans-serif; font-size: 12px; fill: #386288; }
      .panel-title { font-family: Calibri, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #002060; }
      .attr { font-family: Calibri, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #002060; }
      .math { font-family: 'Cascadia Code', Consolas, monospace; font-size: 10.5px; fill: #1f2a44; }
      .note { font-family: Calibri, 'Segoe UI', sans-serif; font-size: 10px; fill: #595959; }
      .person { font-family: Calibri, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; }
      .person-sub { font-family: Calibri, 'Segoe UI', sans-serif; font-size: 11px; fill: #e8eef8; }
      .legend { font-family: Calibri, 'Segoe UI', sans-serif; font-size: 10.5px; fill: #203864; }
      .panel { stroke: #002060; stroke-width: 1.5; rx: 8; ry: 8; }
      .card { fill: #ffffff; stroke: #203864; stroke-width: 1; rx: 6; ry: 6; }
    ]]></style>
  </defs>

  <!-- background -->
  <rect width="1100" height="820" fill="#f7f9fc"/>

  <text x="40" y="36" class="title">How Health-GPS models a person</text>
  <text x="40" y="56" class="subtitle">Attribute groups on Person, with the assignment rule used at initialisation and (where noted) each simulated year. France-style HLM and FINCH/Kevin Hall packs share the Person type but fill different fields.</text>

  <!-- center person -->
  <g filter="url(#shadow)">
    <rect x="430" y="280" width="240" height="120" rx="14" ry="14" fill="#3c63ac" stroke="#002060" stroke-width="2"/>
  </g>
  <text x="550" y="325" text-anchor="middle" class="person">Person</text>
  <text x="550" y="348" text-anchor="middle" class="person-sub">virtual individual state</text>
  <text x="550" y="368" text-anchor="middle" class="person-sub">updated annually by modules</text>
  <text x="550" y="386" text-anchor="middle" class="person-sub">src/HealthGPS/person.h</text>

  <!-- DEMOGRAPHICS panel -->
  <rect class="panel" x="24" y="80" width="360" height="300" fill="#e2efd9"/>
  <text x="40" y="102" class="panel-title">1. Demographics</text>
  <text x="40" y="118" class="note">Module: DemographicModule  |  Inputs: datastore population, births, deaths</text>

  <g filter="url(#shadow)">
    <rect class="card" x="40" y="132" width="328" height="52"/>
  </g>
  <text x="52" y="150" class="attr">Age</text>
  <text x="52" y="166" class="math">init: age ~ population shares(year, age, sex)</text>
  <text x="52" y="180" class="math">yearly: survivors age := age + 1; newborns age = 0</text>

  <g filter="url(#shadow)">
    <rect class="card" x="40" y="192" width="328" height="52"/>
  </g>
  <text x="52" y="210" class="attr">Gender</text>
  <text x="52" y="226" class="math">init: male/female counts from age-sex table</text>
  <text x="52" y="240" class="math">births: sex ~ SRB; encoding male=1, female=0</text>

  <g filter="url(#shadow)">
    <rect class="card" x="40" y="252" width="328" height="52"/>
  </g>
  <text x="52" y="270" class="attr">Region / Ethnicity (optional)</text>
  <text x="52" y="286" class="math">region ~ CDF(prevalence | age, gender)</text>
  <text x="52" y="300" class="math">ethnicity ~ CDF(prevalence | age-group, gender, region)</text>

  <g filter="url(#shadow)">
    <rect class="card" x="40" y="312" width="328" height="52"/>
  </g>
  <text x="52" y="330" class="attr">Sector urban/rural (StaticLinear)</text>
  <text x="52" y="346" class="math">sector ~ Bernoulli(rural prevalence | age-group, sex)</text>
  <text x="52" y="360" class="math">age 18 rural’urban with p = 1 - prev_over18/prev_under18</text>

  <!-- SOCIO panel -->
  <rect class="panel" x="716" y="80" width="360" height="300" fill="#deebf6"/>
  <text x="732" y="102" class="panel-title">2. Socio-economic</text>
  <text x="732" y="118" class="note">SES module + StaticLinear income  |  Config: ses_model, project_requirements</text>

  <g filter="url(#shadow)">
    <rect class="card" x="732" y="132" width="328" height="52"/>
  </g>
  <text x="744" y="150" class="attr">SES noise (ses)</text>
  <text x="744" y="166" class="math">ses ~ Normal(¼, Ã) from modelling.ses_model</text>
  <text x="744" y="180" class="math">yearly redraw for newborns only; adults keep draw</text>

  <g filter="url(#shadow)">
    <rect class="card" x="732" y="192" width="328" height="68"/>
  </g>
  <text x="744" y="210" class="attr">Continuous income (FINCH)</text>
  <text x="744" y="226" class="math">I = X² + µ,  µ ~ N(0, Ã²); then clamp to [min, max]</text>
  <text x="744" y="240" class="math">store income_continuous and risk_factors["income"]</text>
  <text x="744" y="254" class="math">optional factors-mean adjustment on I</text>

  <g filter="url(#shadow)">
    <rect class="card" x="732" y="268" width="328" height="52"/>
  </g>
  <text x="744" y="286" class="attr">Income strata and categories</text>
  <text x="744" y="302" class="math">adjustment stratum: equal-rank split ’ 0..N-1</text>
  <text x="744" y="316" class="math">final income: equal-rank split ’ 3/4/5 categories</text>

  <g filter="url(#shadow)">
    <rect class="card" x="732" y="328" width="328" height="36"/>
  </g>
  <text x="744" y="346" class="attr">Categorical income (India-style)</text>
  <text x="744" y="360" class="math">category ~ softmax(logits); store enum + numeric RF</text>

  <!-- arrows into person -->
  <line x1="384" y1="250" x2="430" y2="320" stroke="#203864" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="716" y1="250" x2="670" y2="320" stroke="#203864" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- BEHAVIOUR / RF panel -->
  <rect class="panel" x="24" y="420" width="360" height="250" fill="#fff2cc"/>
  <text x="40" y="442" class="panel-title">3. Behaviour and risk factors</text>
  <text x="40" y="458" class="note">Static then dynamic RF models  |  FINCH: StaticLinear; France: HLM / EBHLM</text>

  <g filter="url(#shadow)">
    <rect class="card" x="40" y="472" width="328" height="68"/>
  </g>
  <text x="52" y="490" class="attr">Physical activity</text>
  <text x="52" y="506" class="math">simple: PA = ¼(age,sex) · exp(µ - ½Ã²)</text>
  <text x="52" y="520" class="math">continuous: PA = clamp(X² + µ)</text>
  <text x="52" y="534" class="math">mirror physical_activity and RF["PhysicalActivity"]</text>

  <g filter="url(#shadow)">
    <rect class="card" x="40" y="548" width="328" height="100"/>
  </g>
  <text x="52" y="566" class="attr">Other risk factors (foods, nutrients, ...)</text>
  <text x="52" y="582" class="math">residuals r ~ correlated via Cholesky(£)</text>
  <text x="52" y="596" class="math">optional Stage1: P(zero) from logistic</text>
  <text x="52" y="610" class="math">Stage2: value = ¼ · BoxCox{¹(X² + r·Ã, »)</text>
  <text x="52" y="624" class="math">then clamp to configured range; store residual</text>
  <text x="52" y="638" class="math">optional: factors-mean, policy, and trend terms</text>

  <!-- BODY / DISEASE / STATUS -->
  <rect class="panel" x="716" y="420" width="360" height="250" fill="#dae2f3"/>
  <text x="732" y="442" class="panel-title">4. Body, disease, and status</text>
  <text x="732" y="458" class="note">Kevin Hall (FINCH) or hierarchical BMI (France)  |  Disease module</text>

  <g filter="url(#shadow)">
    <rect class="card" x="732" y="472" width="328" height="84"/>
  </g>
  <text x="744" y="490" class="attr">Weight, Height, BMI (Kevin Hall)</text>
  <text x="744" y="506" class="math">ratio = (EI/PA)_actual / (EI/PA)_expected</text>
  <text x="744" y="520" class="math">Weight = W_expected · quantile(ratio | stratum)</text>
  <text x="744" y="534" class="math">Height = H_exp · (W^slope / W_slope) · e^{µ_H-½Ã²}</text>
  <text x="744" y="548" class="math">BMI = Weight / (Height_m)²</text>

  <g filter="url(#shadow)">
    <rect class="card" x="732" y="564" width="328" height="52"/>
  </g>
  <text x="744" y="582" class="attr">Diseases</text>
  <text x="744" y="598" class="math">init: P = prevalence · RR_rf / mean(RR)</text>
  <text x="744" y="612" class="math">yearly: remission then incidence (± PIF)</text>

  <g filter="url(#shadow)">
    <rect class="card" x="732" y="624" width="328" height="36"/>
  </g>
  <text x="744" y="642" class="attr">Alive / death / migration</text>
  <text x="744" y="656" class="math">death hazard from residual × disease excess mortality</text>

  <line x1="384" y1="520" x2="430" y2="380" stroke="#203864" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="716" y1="520" x2="670" y2="380" stroke="#203864" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- pipeline strip -->
  <rect x="24" y="690" width="1052" height="100" fill="#ffffff" stroke="#002060" stroke-width="1.5" rx="8" ry="8"/>
  <text x="40" y="714" class="panel-title">5. Module order (when the maths above is applied)</text>
  <text x="40" y="734" class="math">Init:  Population IDs ’ Demographics ’ SES ’ Static RF generate ’ Dynamic RF generate ’ Diseases ’ Analysis</text>
  <text x="40" y="752" class="math">Year:  Demographic update (death, age++, births) ’ Net migration ’ SES (newborns) ’ RF update ’ Diseases ’ Analysis</text>
  <text x="40" y="770" class="note">Person ID: initial cohort i ’ id = i+1; newborns/immigrants get monotonic next_person_id (never reused). Detail: technical/guides/how-healthgps-models-a-person.md</text>

  <!-- legend -->
  <rect x="40" y="788" width="14" height="14" fill="#e2efd9" stroke="#002060"/>
  <text x="60" y="799" class="legend">Demographics</text>
  <rect x="160" y="788" width="14" height="14" fill="#deebf6" stroke="#002060"/>
  <text x="180" y="799" class="legend">Socio-economic</text>
  <rect x="300" y="788" width="14" height="14" fill="#fff2cc" stroke="#002060"/>
  <text x="320" y="799" class="legend">Behaviour / RF</text>
  <rect x="440" y="788" width="14" height="14" fill="#dae2f3" stroke="#002060"/>
  <text x="460" y="799" class="legend">Body / disease / status</text>
  <text x="680" y="799" class="legend">Arrows: attributes written onto the shared Person state</text>
</svg>
